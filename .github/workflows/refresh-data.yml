name: Refresh vault data

on:
  schedule:
    - cron: "15 0 * * *"   # daily 00:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Rebuild tracked tier (DeFiLlama RWA categories)
        run: python3 registry/fetch_tracked.py

      - name: CoinMarketCap RWA layer (issuers, tokenized assets, wrapper premiums)
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python3 registry/cmc_rwa.py

      - name: Enrich curated registry (DeFiLlama + AskSurf cross-check)
        env:
          ASKSURF_API_KEY: ${{ secrets.ASKSURF_API_KEY }}
        run: python3 registry/enrich.py

      - name: Commit and push if data changed
        run: |
          git config user.name "vaultterms-bot"
          git config user.email "actions@github.com"
          git add registry/tracked.json registry/vaults.enriched.json registry/vaults.json registry/cmc_assets.json registry/cmc_premiums.json registry/cmc_issuers.json registry/cmc_calls.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh: DeFiLlama TVL/APY + tracked tier"
            git push
          fi
